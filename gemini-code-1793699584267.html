<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Atlantic - Customer Support</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --bg: #f8fafc;
      --chat-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --user-msg: #0284c7;
      --bot-msg: #f1f5f9;
      --error-msg: #fef2f2;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      height: 100dvh;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 840px;
      background: var(--chat-bg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    @media (min-width: 640px) {
      .chat-container {
        height: 92vh;
        border-radius: 16px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
    }

    /* Header */
    .header {
      background: #0f172a;
      color: #ffffff;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .header-info h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .header-info p {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* Messages Area */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }

    .message-wrapper.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-wrapper.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 0.75rem 1rem;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .user .bubble {
      background-color: var(--user-msg);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background-color: var(--bot-msg);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bot.error .bubble {
      background-color: var(--error-msg);
      color: var(--error-text);
      border: 1px solid #fecaca;
    }

    .timestamp {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      padding: 0 0.25rem;
    }

    /* Input Area */
    .input-area {
      padding: 1rem;
      border-top: 1px solid var(--border);
      background: #ffffff;
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 24px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 24px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-dark);
    }

    button:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header class="header">
      <div class="header-icon">🌊</div>
      <div class="header-info">
        <h1>Ask Atlantic</h1>
        <p>Atlantic Coast Tours Assistant</p>
      </div>
    </header>

    <main class="messages-area" id="messages"></main>

    <footer class="input-area">
      <input type="text" id="userInput" placeholder="Ask about tours, prices, or slots..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </footer>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";
    const CHAT_URL = "https://luas-class.kluxy.app/chat";
    const SYSTEM_PROMPT = "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

    const messagesContainer = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // Welcome message
    addBubble("bot", "Hello! Welcome to Atlantic Coast Tours. How can I help you with our live tour schedule, prices, or available slots today?");

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    async function handleSend() {
      const question = userInput.value.trim();
      if (!question) return;

      // Display user message
      addBubble("user", question);
      userInput.value = "";
      setInputsDisabled(true);

      // Display "Thinking..." bubble
      const thinkingWrapper = addBubble("bot", "Thinking...");

      try {
        // 1. Fetch live CSV catalog
        const csvResponse = await fetch(CSV_URL);
        if (!csvResponse.ok) throw new Error("Failed to load live tour catalogue.");
        const csvData = await csvResponse.text();

        // Timestamp for data fetch
        const now = new Date();
        const timeString = now.toTimeString().split(' ')[0];

        // 2. Send to Brain API
        const chatResponse = await fetch(CHAT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system: SYSTEM_PROMPT,
            messages: [{
              role: "user",
              content: "Live data (CSV):\n" + csvData + "\n\nCustomer question: " + question
            }]
          })
        });

        if (!chatResponse.ok) throw new Error("Service unavailable. Please try again.");
        const json = await chatResponse.json();

        if (json && json.reply) {
          // Replace thinking bubble with reply
          updateBubble(thinkingWrapper, json.reply, `Data fetched live at ${timeString}`);
        } else {
          throw new Error("Invalid response received from the assistant.");
        }

      } catch (err) {
        updateBubble(thinkingWrapper, "Error: " + err.message, null, true);
      } finally {
        setInputsDisabled(false);
        userInput.focus();
      }
    }

    function addBubble(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = `message-wrapper ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrapper.appendChild(bubble);

      messagesContainer.appendChild(wrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      return wrapper;
    }

    function updateBubble(wrapper, text, timestampText = null, isError = false) {
      const bubble = wrapper.querySelector(".bubble");
      bubble.textContent = text;

      if (isError) {
        wrapper.classList.add("error");
      }

      if (timestampText) {
        const timeElem = document.createElement("div");
        timeElem.className = "timestamp";
        timeElem.textContent = timestampText;
        wrapper.appendChild(timeElem);
      }

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function setInputsDisabled(disabled) {
      userInput.disabled = disabled;
      sendBtn.disabled = disabled;
    }
  </script>
</body>
</html>
